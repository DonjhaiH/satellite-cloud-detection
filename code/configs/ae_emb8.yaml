data:
  patch_size: 9
  max_images: 60
dataloader_train:
  batch_size: 2048
  num_workers: 0
  shuffle: True
dataloader_val:
  batch_size: 2048
  num_workers: 0
  shuffle: False
autoencoder:
  n_input_channels: 8
  embedding_size: 8
optimizer:
  lr: 0.001
trainer:
  max_epochs: 75
  log_every_n_steps: 10
checkpoint:
  save_top_k: 1
  monitor: 'val_loss'
  mode: 'min'
  filename: 'best_emb8-{epoch:03d}'
  dirpath: 'checkpoints'
wandb:
  project: 'lab2-autoencoder'
  name: 'default'
    # you should change "default" to something else
    # for your experiments
